[workspace]
members = ["programs/*"]
resolver = "1"
rust-version = "1.75"

[patch.crates-io]
wasip2 = { path = "vendor/wasip2" }
wasip3 = { path = "vendor/wasip3" }
proc-macro-crate = { path = "vendor/proc-macro-crate" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
